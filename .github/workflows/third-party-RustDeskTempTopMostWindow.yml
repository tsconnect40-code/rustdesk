name: build RustDeskTempTopMostWindow

on:
  workflow_call:
    inputs:
        upload-artifact:
          type: boolean
          default: true
        target:
            description: 'Target'
            required: true
            type: string
            default: 'windows-2022'
        configuration:
            description: 'Configuration'
            required: true
            type: string
            default: 'Release'
        platform:
            description: 'Platform'
            required: true
            type: string
            default: 'x64'
        target_version:
            description: 'TargetVersion'
            required: true
            type: string
            default: 'Windows10'

env:
  project_path: WindowInjection/WindowInjection.vcxproj

jobs:
  build-RustDeskTempTopMostWindow:
    runs-on: ${{ inputs.target }}
    strategy:
        fail-fast: false
    env:
      build_output_dir: RustDeskTempTopMostWindow/WindowInjection/${{ inputs.platform }}/${{ inputs.configuration }}
    steps:
      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@6fb02220983dee41ce7ae257b6f4d8f9bf5ed4ce # v2

      - name: Download the source code
        run: |
          git clone https://github.com/rustdesk-org/RustDeskTempTopMostWindow RustDeskTempTopMostWindow
          cd RustDeskTempTopMostWindow && git checkout ecd8d6a139eee76845ea66423fb739af450fda90

      # tsconnect build: our own privacy-mode screen (black, small 'TS원격' note)
      - name: Checkout TS privacy image
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          path: tsrepo
          sparse-checkout: res/ts-privacy.png
          sparse-checkout-cone-mode: false

      - name: Use TS privacy image
        shell: python
        run: |
          data = open('tsrepo/res/ts-privacy.png', 'rb').read()
          rows = [', '.join('0x%02x' % c for c in data[i:i + 20]) for i in range(0, len(data), 20)]
          nl = chr(10)
          src = nl.join(['#include "pch.h"', '#include "./img.h"', '', 'const unsigned char g_img[] = {',
                         (',' + nl).join(rows), '};', '', 'const long long g_imgLen = sizeof(g_img);', ''])
          open('RustDeskTempTopMostWindow/WindowInjection/img.cpp', 'w').write(src)
          print('img.cpp replaced,', len(data), 'bytes')

      - name: Build the project
        run: |
          cd RustDeskTempTopMostWindow
          msbuild ${{ env.project_path }} -p:Configuration=${{ inputs.configuration }} -p:Platform=${{ inputs.platform }} /p:TargetVersion=${{ inputs.target_version }}

      - name: Archive build artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ inputs.upload-artifact }}
        with:
            name: topmostwindow-artifacts-${{ inputs.platform }}
            path: |
              ./${{ env.build_output_dir }}/WindowInjection.dll
